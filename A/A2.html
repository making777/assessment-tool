<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>解析結果 | 星詠み研究所</title>

  <link rel="stylesheet" href="A.css">

</head>


<body>


<header class="site-header">

  <div class="header-mark">
    S.R.I.
  </div>

  <div>

    <h1>
      星詠み研究所
    </h1>

    <p>
      SEIYOMI RESEARCH INSTITUTE
    </p>

  </div>

</header>


<main class="container">


  <section class="hero">

    <span class="label">
      AMDS / ANALYSIS REPORT
    </span>

    <h2>
      解析結果
    </h2>

    <p>
      入力された情報を基にしたA系統の暫定解析結果です。
    </p>

  </section>


  <section class="result-card">


    <div class="report-top">

      <span>
        ANALYSIS REPORT
      </span>

      <span id="reportId">
        AMDS-------
      </span>

    </div>


    <div class="grade-area">


      <div>

        <div class="small-label">
          APTITUDE GRADE
        </div>

        <div
          id="grade"
          class="grade"
        >
          --
        </div>

      </div>


      <div class="result-copy">

        <div class="small-label">
          PRIMARY TYPE
        </div>

        <h2 id="type">
          --
        </h2>

        <p id="message">
          解析中...
        </p>

      </div>

    </div>


    <div class="result-grid">


      <div>

        <span>
          星座
        </span>

        <strong id="rZodiac">
          --
        </strong>

      </div>


      <div>

        <span>
          血液型
        </span>

        <strong id="rBlood">
          --
        </strong>

      </div>


      <div>

        <span>
          特殊血統
        </span>

        <strong id="rLineage">
          --
        </strong>

      </div>


      <div>

        <span>
          出生環境
        </span>

        <strong id="rOrigin">
          --
        </strong>

      </div>


    </div>

  </section>


  <div class="button-row">


    <a
      href="A1.html"
      class="secondary-button"
    >
      入力画面へ戻る
    </a>


    <a
      href="A3.html"
      class="primary-button"
    >
      詳細解析を見る
    </a>


  </div>


</main>


<footer>
  SEIYOMI RESEARCH INSTITUTE / AMDS
</footer>


<script src="A.js"></script>


</body>
</html>
